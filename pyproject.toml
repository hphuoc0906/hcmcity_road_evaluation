[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadnet"
version = "0.2.0"
description = "Criticality and vulnerability analysis of the Ho Chi Minh City road network via Contraction Hierarchies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Phan Hoang Phuoc" }]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
osm = [
    "pyrosm>=0.6",
    "osmnx>=1.9",
    "geopandas>=0.14",
    "shapely>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
roadnet = "roadnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
